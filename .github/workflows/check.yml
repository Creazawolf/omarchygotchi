name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Client and legacy-server tests
        run: python3 -m unittest discover -s community -p 'test_*.py'
      - name: Simulation regressions
        run: node community/test_sim.cjs
      - name: Community backend regressions
        working-directory: cloudflare
        run: npm test
